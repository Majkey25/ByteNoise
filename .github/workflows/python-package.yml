name: Python Package

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install build backend
        run: python -m pip install --upgrade build pip
      - name: Build package
        run: python -m build
      - uses: actions/upload-artifact@v5
        with:
          name: bytenoise-dist
          path: dist/*
