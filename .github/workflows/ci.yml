name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q ByteNoise.pyw src/bytenoise
      - name: Lint
        run: |
          python -m pip install ruff
          ruff check .
