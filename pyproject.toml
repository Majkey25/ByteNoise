[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bytenoise"
version = "0.1.0"
description = "Tiny reversible text obfuscator with a simple Tkinter UI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "ByteNoise contributors" }]
keywords = ["tkinter", "text", "encoding", "obfuscation"]
dependencies = []

[project.scripts]
bytenoise = "bytenoise.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
